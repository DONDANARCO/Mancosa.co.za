<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MANCOSA Student Portal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e6440;--navy2:#1a7d52;--acc:#f26b21;--bg:#f3f5f9;--card:#fff;--tx:#14213d;--mu:#5d6b85;--bd:#e0e5ee;--ok:#13804a;--okbg:#e2f5ea;--bad:#b3261e;--badbg:#fde8e6;--wn:#8a5a00;--wnbg:#fff1d6;--in:#1d4ed8;--inbg:#e3ecff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--card:#16203a;--tx:#e8edf7;--mu:#9aa8c4;--bd:#27345a;--okbg:#10331f;--ok:#5fd18e;--badbg:#3d1714;--bad:#ff9a92;--wnbg:#3a2c0a;--wn:#f5c866;--inbg:#16294f;--in:#8fb2ff;--navy:#0a4a2f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1424;--card:#16203a;--tx:#e8edf7;--mu:#9aa8c4;--bd:#27345a;--okbg:#10331f;--ok:#5fd18e;--badbg:#3d1714;--bad:#ff9a92;--wnbg:#3a2c0a;--wn:#f5c866;--inbg:#16294f;--in:#8fb2ff;--navy:#0a4a2f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif}
a{color:inherit;text-decoration:none}
.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:12px 24px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:700;letter-spacing:.14em;font-size:20px}.logo i{color:var(--acc);font-style:normal}
.top .sp{flex:1}.who{font-size:13px;opacity:.9}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:9px 18px;font:600 13px "IBM Plex Sans",sans-serif;cursor:pointer}
.btn.o{background:transparent;border:1px solid currentColor;color:inherit}
.wrap{display:flex;max-width:1200px;margin:0 auto;gap:24px;padding:24px}
nav{width:230px;flex:none}
nav h6{margin:18px 0 6px;font-size:11px;letter-spacing:.1em;color:var(--mu);text-transform:uppercase}
nav a{display:block;padding:8px 12px;border-radius:6px;color:var(--tx);font-size:13px}
nav a:hover{background:var(--bd)}nav a.on{background:var(--navy);color:#fff}
main{flex:1;min-width:0}
h1{font-size:24px;margin:0 0 4px;color:var(--navy)}h2{font-size:16px;margin:24px 0 10px}
@media (prefers-color-scheme:dark){h1{color:#fff}}
.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat b{display:block;font-size:26px;color:var(--navy)}@media (prefers-color-scheme:dark){.stat b{color:#fff}}
.stat span{color:var(--mu);font-size:12px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--bd);font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600}
.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}.wn{background:var(--wnbg);color:var(--wn)}.in{background:var(--inbg);color:var(--in)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--bd);margin-bottom:18px}
.tabs a{padding:9px 18px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a.on{color:var(--acc);border-color:var(--acc)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mc{display:block}.mc:hover{border-color:var(--acc)}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--navy2));padding:20px}
.lbox{background:var(--card);border-radius:12px;padding:32px;width:100%;max-width:400px}
.lbox label{display:block;font-size:12px;font-weight:600;margin:14px 0 4px}
.lbox input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:14px "IBM Plex Sans",sans-serif}
.hint{background:var(--inbg);color:var(--in);border-radius:6px;padding:10px;font-size:12px;margin-top:16px}
.err{color:var(--bad);font-size:12px;margin-top:8px;min-height:16px}
.drop{border:2px dashed var(--bd);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media (max-width:760px){.wrap{flex-direction:column;padding:14px}nav{width:100%}.top{padding:10px 14px}.who{display:none}}
.hero{background:linear-gradient(rgba(14,100,64,.94),rgba(14,100,64,.8)),url(https://www.mancosa.co.za/wp-content/uploads/2024/02/Bachelor-of-Business-Administration-Honours-Featured-Image-1200x675.jpg) center/cover var(--navy);color:#fff;padding:80px 24px}
.ct{max-width:1100px;margin:0 auto}.hero h1{color:#fff;font-size:40px;line-height:1.15;max-width:700px;margin:8px 0 14px}.hero p{max-width:640px;opacity:.92}
.eyebrow{color:var(--acc);font-weight:600;letter-spacing:.1em;font-size:12px;text-transform:uppercase}
.facts{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.facts span{border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:6px 16px;font-size:13px}
.sec{padding:56px 24px}.sec.alt{background:var(--card)}.sec h2{font-size:26px;margin:0 0 16px;color:var(--navy)}
@media (prefers-color-scheme:dark){.sec h2{color:#fff}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px}.sec ul{padding-left:18px;margin:8px 0}.sec li{margin-bottom:6px}
details{border:1px solid var(--bd);border-radius:8px;padding:12px 16px;margin-bottom:10px;background:var(--bg)}summary{cursor:pointer;font-weight:600}
.step{display:flex;gap:14px;margin-bottom:14px}.step b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}
.foot{background:var(--navy);color:#fff;padding:28px 24px;font-size:12px;text-align:center}
.nl{display:flex;gap:18px}.nl a{color:#fff;font-size:13px;cursor:pointer;opacity:.9}
@media (max-width:760px){.two{grid-template-columns:1fr}.nl{display:none}.hero h1{font-size:28px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var STU={name:'Nathan Hlungwane',no:'202610473',pw:'Nh@27Qx49!',prog:'Bachelor of Business Administration Honours (BBA Hons)',nqf:'NQF Level 8',year:'2026'};
var M=[
{id:'hrm',s:1,n:'Contemporary Human Resource Management',c:'CHRM801',t:68,a:72,e:61,u:['Strategic HRM and the SA labour context','Talent acquisition and retention','Performance and reward management','Employment relations and labour law','HR analytics and the future of work']},
{id:'cbs',s:1,n:'Corporate and Business Strategy',c:'CBST801',t:74,a:66,e:58,u:['Strategic analysis and the external environment','Internal resources and capabilities','Business-level and corporate strategy','Strategy implementation and change','Governance, ethics and sustainability']},
{id:'qmb',s:1,n:'Quantitative Methods and Business Research Methodology',c:'QMBR801',t:55,a:62,e:null,x:1,u:['Descriptive statistics and probability','Hypothesis testing and inference','Regression and forecasting','Research design and sampling','Data collection and analysis']},
{id:'mkt',s:1,n:'Marketing Management',c:'MKTM801',t:81,a:77,e:70,u:['Marketing strategy and segmentation','Consumer behaviour','Brand and product management','Pricing, channels and promotion','Digital and relationship marketing']},
{id:'osc',s:2,n:'Operations and Supply Chain Management',c:'OSCM801',t:64,a:70,e:null,d:'15 Nov 2026',u:['Operations strategy','Process design and capacity','Inventory and supply chain planning','Quality and lean management','Logistics and global supply networks']},
{id:'afm',s:2,n:'Accounting and Financial Management',c:'AFIN801',t:58,a:61,e:null,d:'18 Nov 2026',u:['Financial statements and analysis','Cost and management accounting','Budgeting and cash flow','Capital investment decisions','Working capital and financing']},
{id:'rr',s:2,n:'Research Report',c:'RREP801',t:66,a:72,e:null,d:'20 Nov 2026',rr:1,u:['Topic selection and proposal','Literature review','Methodology and ethics','Analysis and findings','Writing up and submission']}
];
M.forEach(function(m){m.y=Math.round((m.t*.2+m.a*.3)/.5);m.q=m.y>=40;m.f=m.e==null?null:Math.round(m.t*.2+m.a*.3+m.e*.5);
m.slots=[{k:'Digital test',w:20,mk:m.t,date:m.s==1?'18 Apr 2026':'22 Sep 2026',type:'online'},{k:'Assignment',w:30,mk:m.a,date:m.s==1?'16 May 2026':'10 Oct 2026',type:'file',file:'N_Hlungwane_'+m.c+'_Assignment.pdf'},
m.rr?{k:'Final research report',w:50,type:'upload',date:'20 Nov 2026'}:{k:'Examination',w:50,mk:m.e,date:m.d||'Jun 2026',type:'exam',nw:m.x}]});
var S={in:false,up:{}};
function pill(m){if(m.f!=null)return m.f>=50?'<span class="pill ok">Passed</span>':'<span class="pill bad">Failed</span>';if(m.x)return '<span class="pill bad">Exam not written</span>';return '<span class="pill in">Exam '+(m.d||'')+'</span>'}
function mod(id){return M.filter(function(m){return m.id==id})[0]}
function shell(h,body){return '<div class="top"><a href="#dash">'+logo()+'</a><span class="sp"></span><span class="who">'+STU.name+' · '+STU.no+'</span><button class="btn o" onclick="out()">Log out</button></div><div class="wrap"><nav>'+nav(h)+'</nav><main>'+body+'</main></div>'}
function nav(h){var s='<a class="'+(h=='dash'?'on':'')+'" href="#dash">Dashboard</a><a class="'+(h=='rec'?'on':'')+'" href="#record">Academic record</a>';
[1,2].forEach(function(n){s+='<h6>Semester '+n+'</h6>';M.filter(function(m){return m.s==n}).forEach(function(m){s+='<a class="'+(h==m.id?'on':'')+'" href="#'+m.id+'-coursework">'+m.n+'</a>'})});return s}
function login(e){return '<div class="login"><div class="lbox"><div style="background:var(--navy);margin:-32px -32px 8px;padding:22px 32px;border-radius:12px 12px 0 0">'+logo()+'</div><p class="sub" style="margin:14px 0 0">Student portal · BBA Honours</p><label>Student number</label><input id="u" value=""><label>Password</label><input id="p" type="password" onkeydown="if(event.key==\'Enter\')go()"><div class="err">'+(e||'')+'</div><button class="btn" style="width:100%;margin-top:8px" onclick="go()">Sign in</button><p style="text-align:center;margin:16px 0 0;font-size:12px"><a href="#home" style="color:var(--mu)">&larr; Back to mancosa.co.za</a></p></div></div>'}
function go(){if(document.getElementById('u').value.trim()==STU.no&&document.getElementById('p').value==STU.pw){S.in=true;location.hash='dash';draw()}else document.getElementById('app').innerHTML=login('Incorrect student number or password.')}
function out(){S.in=false;location.hash='';draw()}
function dash(){var done=M.filter(function(m){return m.f>=50}).length,s=M.map(function(m){return '<a class="card mc" href="#'+m.id+'-coursework"><div class="row"><b>'+m.n+'</b>'+pill(m)+'</div><p class="sub" style="margin:2px 0 10px">'+m.c+' · Semester '+m.s+'</p><div class="bar"><i style="width:'+m.y+'%"></i></div><small style="color:var(--mu)">Year mark '+m.y+'%</small></a>'}).join('');
return '<h1>Welcome back, Nathan</h1><p class="sub">'+STU.prog+' · '+STU.year+' intake</p><div class="grid"><div class="card stat"><b>'+done+' / 7</b><span>Modules passed</span></div><div class="card stat"><b>3 / 3</b><span>Semester 2 exam qualifications</span></div><div class="card stat"><b>7 days</b><span>Until exams begin (15 Nov)</span></div><div class="card stat"><b>1</b><span>Outstanding exam (QMBR801)</span></div></div><h2>Examination timetable</h2><div class="card tbl"><table><tr><th>Module</th><th>Date</th><th>Status</th></tr>'+M.filter(function(m){return m.d}).map(function(m){return '<tr><td>'+m.n+'</td><td>'+m.d+'</td><td><span class="pill ok">Qualified</span></td></tr>'}).join('')+'</table></div><h2>My modules</h2><div class="grid">'+s+'</div>'}
function rec(){var h='<h1>Academic record</h1><p class="sub">'+STU.name+' · '+STU.no+' · '+STU.prog+' · '+STU.nqf+'</p>';
[1,2].forEach(function(n){h+='<h2>Semester '+n+'</h2><div class="card tbl"><table><tr><th>Module</th><th>Test 20%</th><th>Assign. 30%</th><th>Year mark</th><th>Exam admission</th><th>Exam 50%</th><th>Final</th><th>Result</th></tr>';
M.filter(function(m){return m.s==n}).forEach(function(m){h+='<tr><td><a href="#'+m.id+'-coursework"><b>'+m.n+'</b></a><br><small style="color:var(--mu)">'+m.c+'</small></td><td>'+m.t+'%</td><td>'+m.a+'%</td><td>'+m.y+'%</td><td><span class="pill '+(m.q?'ok':'bad')+'">'+(m.q?'Qualified':'Not qualified')+'</span></td><td>'+(m.e!=null?m.e+'%':m.x?'DNW':'Pending')+'</td><td><b>'+(m.f!=null?m.f+'%':'—')+'</b></td><td>'+pill(m)+'</td></tr>'});h+='</table></div>'});
return h+'<p class="sub">A year mark (test and assignment combined) of at least 40% is required to write the exam. A final mark of 50% or more is a pass. DNW = did not write.</p>'}
function tabs(m,t){return '<div class="tabs"><a class="'+(t=='coursework'?'on':'')+'" href="#'+m.id+'-coursework">Coursework</a><a class="'+(t=='submissions'?'on':'')+'" href="#'+m.id+'-submissions">Submissions</a></div>'}
function head(m){return '<h1>'+m.n+'</h1><p class="sub">'+m.c+' · Semester '+m.s+' · '+pill(m)+'</p>'}
function cw(m){return head(m)+tabs(m,'coursework')+'<div class="card"><b>Assessment structure</b><div class="grid" style="margin-top:12px"><div class="stat"><b>20%</b><span>Digital test · '+m.t+'%</span></div><div class="stat"><b>30%</b><span>Assignment · '+m.a+'%</span></div><div class="stat"><b>50%</b><span>'+(m.rr?'Final report':'Exam')+' · '+(m.e!=null?m.e+'%':m.x?'Not written':'Pending')+'</span></div></div></div><h2>Learning units</h2>'+m.u.map(function(u,i){return '<div class="card row"><div><b>Unit '+(i+1)+'</b> · '+u+'</div><span class="pill ok">Completed</span></div>'}).join('')+'<h2>Resources</h2><div class="card">Study guide · Prescribed textbook · Past exam papers · Online lecture recordings</div>'}
function sub(m){var h=head(m)+tabs(m,'submissions')+'<div class="card tbl"><table><tr><th>Assessment</th><th>Weight</th><th>Date</th><th>Status</th><th>Mark</th></tr>';
m.slots.forEach(function(s){var st,mk;
if(s.type=='exam'){st=s.nw?'<span class="pill bad">Did not write</span>':s.mk!=null?'<span class="pill ok">Written</span>':'<span class="pill in">Scheduled · eligible</span>';mk=s.mk!=null?s.mk+'%':'—'}
else if(s.type=='upload'){var u=S.up[m.id];st=u?'<span class="pill ok">Submitted</span>':'<span class="pill wn">Open for submission</span>';mk='—'}
else{st='<span class="pill ok">Marked</span>';mk=s.mk+'%'}
h+='<tr><td><b>'+s.k+'</b>'+(s.file?'<br><small style="color:var(--mu)">'+s.file+'</small>':'')+'</td><td>'+s.w+'%</td><td>'+s.date+'</td><td>'+st+'</td><td>'+mk+'</td></tr>'});
h+='</table></div>';
if(m.x)h+='<div class="card" style="border-color:var(--bad)"><b>Exam not written</b><p class="sub" style="margin:4px 0 0">You qualified with a '+m.y+'% year mark but did not sit the exam. Contact Student Support about a supplementary sitting.</p></div>';
if(m.rr)h+='<h2>Submit final research report</h2><div class="card"><div class="drop"><div id="f_'+m.id+'">'+(S.up[m.id]?'<b>'+S.up[m.id].n+'</b><br><small style="color:var(--mu)">Uploaded '+S.up[m.id].d+'</small>':'No file selected · Due 20 Nov 2026')+'</div><input type="file" accept=".pdf,.doc,.docx" onchange="up(\''+m.id+'\',this)"></div></div>';
else h+='<h2>Upload supporting documents</h2><div class="card"><div class="drop"><div id="f_'+m.id+'">'+(S.up[m.id]?'<b>'+S.up[m.id].n+'</b><br><small style="color:var(--mu)">Uploaded '+S.up[m.id].d+'</small>':'Mark queries, medical certificates, appeals')+'</div><input type="file" onchange="up(\''+m.id+'\',this)"></div></div>';
return h}

+'<header class="hero"><div class="ct"><div class="eyebrow">Postgraduate · School of Business</div><h1>Bachelor of Business Administration Honours</h1><p>Build on your foundational knowledge and gain the strategic skills needed to manage the key areas of an organisation.</p><div class="facts"><span>NQF Level 8</span><span>1 Year</span><span>120 Credits</span><span>SAQA ID 97881</span></div><a class="btn" href="'+AP+'" target="_blank" rel="noopener">Apply now</a> <a class="btn o" href="#login" style="margin-left:8px">Student portal</a></div></header>'
+'<section class="sec" id="about"><div class="ct two"><div><h2>About the programme</h2><p>The BBA Honours helps students realise their career goals through relevant knowledge, skills and acumen, and offers a cognate progression into management.</p><p>It is designed for graduates and professionals from a wide range of business backgrounds, giving them higher-level management skills and frameworks they can apply to make a real difference in the workplace.</p><p>The programme covers accounting, human resource management, marketing, strategy and operations management. It is offered through distance learning with online support.</p><p><b>Articulation:</b> completing an Honours degree meets the minimum entry requirement for a cognate Master’s degree.</p></div><div><h2>Outcomes</h2><ul><li>Understand a broad range of management functions and critically examine management practice</li><li>Apply conceptual and analytical frameworks in different organisational conditions</li><li>Use creative and critical thinking to solve business problems</li><li>Develop business policies and strategies that meet stakeholder requirements</li><li>Demonstrate awareness of ethical and global issues in business</li><li>Develop conceptual and applied entrepreneurial skills</li></ul></div></div></section>'
